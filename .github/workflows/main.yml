name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Ci_Test_Passw0rd!"
        ports:
          - 1433:1433

    env:
      IntegrationTestConnection: "Server=localhost,1433;Database=ECommerceDb_IntegrationTests;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
      IdentityIntegrationTestConnection: "Server=localhost,1433;Database=ECommerceIdentityDb_IntegrationTests;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;Encrypt=False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server failed to start"
          exit 1

      - name: Restore dependencies
        run: dotnet restore ECommerce.OrderManagement/ECommerce.OrderManagement.sln

      - name: Build solution
        run: dotnet build ECommerce.OrderManagement/ECommerce.OrderManagement.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ECommerce.OrderManagement/ECommerce.OrderManagement.sln --configuration Release --no-build
