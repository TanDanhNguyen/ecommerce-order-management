name: .NET CI

env:
  IntegrationTestConnection: "Server=localhost,1433;Database=ECommerceDb_IntegrationTests;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
  IdentityIntegrationTestConnection: "Server=localhost,1433;Database=ECommerceIdentityDb_IntegrationTests;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
  ASPNETCORE_ENVIRONMENT: Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Ci_Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      IntegrationTestConnection: "Server=localhost,1433;Database=ECommerceDb_IntegrationTests;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
      ASPNETCORE_ENVIRONMENT: Testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ECommerce.OrderManagement.sln

      - name: Build solution
        run: dotnet build ECommerce.OrderManagement.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ECommerce.OrderManagement.sln --configuration Release --no-build